apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: argocd          # Application objects live in the argocd namespace
spec:
  project: default
  source:
    repoURL: https://github.com/alouane04/argocd-example-apps.git
    targetRevision: HEAD     # latest commit
    path: guestbook          # folder inside the repo
  destination:
    server: https://kubernetes.default.svc   # this cluster (your kind cluster)
    namespace: guestbook     # where the app gets deployed
  syncPolicy:
    automated:
      prune: true    # delete resources that you remove from Git
      selfHeal: true # undo manual changes in the cluster
    syncOptions:
      - CreateNamespace=true
